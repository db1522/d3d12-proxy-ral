# Builds the proxy and, for a pushed tag (e.g. v1.0.0), publishes d3d12-proxy.zip with dxgi.dll and dxgi_proxy.ini,
# the same layout as the upstream releases, so tools can switch to this fork by changing only the repository.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 .

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter dxgi.dll -Path x64\Release | Select-Object -First 1
          if (-not $dll) { throw 'dxgi.dll was not built.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dll.FullName dist\dxgi.dll
          Copy-Item dxgi-proxy\dxgi_proxy.ini dist\dxgi_proxy.ini
          Compress-Archive -Path dist\dxgi.dll, dist\dxgi_proxy.ini -DestinationPath d3d12-proxy.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: d3d12-proxy
          path: d3d12-proxy.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: d3d12-proxy.zip
          generate_release_notes: true
